{% extends "base.html" %}

{% block title %}供应商管理 - ERP Demo{% endblock %}

{% block content %}
<section class="page-header" data-page-type="master-list">
  <div>
    <p class="eyebrow">MASTER DATA</p>
    <h1>供应商管理</h1>
    <p class="page-description">维护供应商基础资料。</p>
  </div>
  <a class="btn btn-primary" href="{{ url_for('suppliers.new_supplier') }}">新增供应商</a>
</section>
<section class="surface-card table-card"><div class="table-responsive">
  <table class="table table-hover mb-0 align-middle">
    <thead><tr><th>供应商名称</th><th>电话</th><th>操作</th></tr></thead>
    <tbody>
      {% for supplier in suppliers %}
      <tr><td>{{ supplier.name }}</td><td>{{ supplier.phone or "-" }}</td><td><a href="{{ url_for('suppliers.edit_supplier', supplier_id=supplier.id) }}">编辑</a></td></tr>
      {% else %}
      <tr><td colspan="3" class="text-center text-muted py-4">暂无供应商</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div></section>
{% endblock %}
