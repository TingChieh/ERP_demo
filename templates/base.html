<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ERP Demo{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  </head>
  <body>
    <div class="d-flex min-vh-100">
      <aside class="sidebar p-3">
        <h4 class="mb-4">ERP Demo</h4>
        <nav class="nav flex-column gap-1">
          <a class="nav-link active" href="{{ url_for('dashboard') }}">Dashboard</a>
          <a class="nav-link" href="{{ url_for('assistant.assistant_page') }}">AI 助手</a>
          <div class="nav-section">基础资料</div>
          <a class="nav-link" href="{{ url_for('products.list_products') }}">商品管理</a>
          <a class="nav-link" href="{{ url_for('suppliers.list_suppliers') }}">供应商管理</a>
          <a class="nav-link" href="{{ url_for('customers.list_customers') }}">客户管理</a>
          <div class="nav-section">采购管理</div>
          <a class="nav-link" href="{{ url_for('purchase_orders.list_purchase_orders') }}">采购订单</a>
          <a class="nav-link" href="{{ url_for('purchase_orders.new_purchase_order') }}">新建采购订单</a>
          <a class="nav-link disabled" href="#">采购入库</a>
          <div class="nav-section">库存管理</div>
          <a class="nav-link disabled" href="#">当前库存</a>
          <a class="nav-link disabled" href="#">库存流水</a>
          <div class="nav-section">销售管理</div>
          <a class="nav-link" href="{{ url_for('sales_orders.list_sales_orders') }}">销售订单</a>
          <a class="nav-link" href="{{ url_for('sales_orders.new_sales_order') }}">新建销售订单</a>
          <a class="nav-link disabled" href="#">销售出库</a>
          <div class="nav-section">财务管理</div>
          <a class="nav-link" href="{{ url_for('settlements.list_receivables') }}">应收账款</a>
          <a class="nav-link" href="{{ url_for('settlements.list_payables') }}">应付账款</a>
        </nav>
      </aside>

      <main class="flex-grow-1 p-4">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
