{% extends "base.html" %}

{% block title %}{{ "编辑客户" if customer else "新增客户" }} - ERP Demo{% endblock %}

{% block content %}
<div class="mb-4"><h1 class="h3 mb-1">{{ "编辑客户" if customer else "新增客户" }}</h1></div>
{% if errors %}<div class="alert alert-danger"><ul class="mb-0">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
<div class="card border-0 shadow-sm"><div class="card-body">
  <form method="post">
    <div class="mb-3"><label class="form-label" for="name">客户名称</label><input class="form-control" id="name" name="name" value="{{ form_data.name }}" required></div>
    <div class="mb-3"><label class="form-label" for="phone">电话</label><input class="form-control" id="phone" name="phone" value="{{ form_data.phone }}"></div>
    <div class="d-flex gap-2"><button class="btn btn-primary" type="submit">保存</button><a class="btn btn-outline-secondary" href="{{ url_for('customers.list_customers') }}">取消</a></div>
  </form>
</div></div>
{% endblock %}
