{% extends "base.html" %}

{% block title %}客户管理 - ERP Demo{% endblock %}

{% block content %}
<section class="page-header" data-page-type="master-list">
  <div>
    <p class="eyebrow">MASTER DATA</p>
    <h1>客户管理</h1>
    <p class="page-description">维护客户基础资料。</p>
  </div>
  <a class="btn btn-primary" href="{{ url_for('customers.new_customer') }}">新增客户</a>
</section>
<section class="surface-card table-card"><div class="table-responsive">
  <table class="table table-hover mb-0 align-middle">
    <thead><tr><th>客户名称</th><th>电话</th><th>操作</th></tr></thead>
    <tbody>
      {% for customer in customers %}
      <tr><td>{{ customer.name }}</td><td>{{ customer.phone or "-" }}</td><td><a href="{{ url_for('customers.edit_customer', customer_id=customer.id) }}">编辑</a></td></tr>
      {% else %}
      <tr><td colspan="3" class="text-center text-muted py-4">暂无客户</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div></section>
{% endblock %}
